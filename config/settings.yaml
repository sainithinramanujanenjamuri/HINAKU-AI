# HINAKU settings. Edit freely; the app reloads on change.

app:
  name: HINAKU
  persona_file: config/hinaku_persona.md
  hotkey: ctrl+alt+h            # summon / hide window
  reduced_motion: false

router:
  mode: auto                    # auto | local_only | api_only
  fallback_on_failure: true     # use the other backend if one is down (ignored in forced modes)
  # In auto mode: short/simple/private -> local, hard reasoning -> api
  local_max_prompt_tokens: 1500
  show_backend_indicator: true  # show "local" or "API" on every reply
  personal_statement_patterns:
    - '(?i)\b(?:i\s+feel|i''?m\s+feeling|i\s+am\s+feeling)\b'
    - '(?i)\b(?:i''?m|i\s+am)\s+(?:worried|anxious|stressed|sad|depressed|happy|scared|upset|hurting|sick|exhausted|tired|burned\s+out|overwhelmed)\b'
    - '(?i)\bmy\s+(?:family|mom|mother|dad|father|parents|brother|sister|wife|husband|partner|boyfriend|girlfriend|child|kids|son|daughter)\b'
    - '(?i)\bmy\s+(?:health|doctor|illness|fever|headache|surgery|diagnosis|medication|hospital)\b'
    - '(?i)\bi\s+(?:have|had|got)\s+(?:a\s+)?(?:fever|headache|cough|cold|infection|disease|pain)\b'
    - '(?i)\bmy\s+(?:salary|savings|money|rent|debt|bank|budget|income|expenses|mortgage|finances)\b'
    - '(?i)\b(?:i\s+owe|i\s+spent|i\s+invested)\b'
    - '(?i)\b(?:i\s+live\s+in|my\s+city|my\s+hometown|my\s+home|my\s+house|my\s+apartment|my\s+address|i''?m\s+moving\s+to)\b'
    - '(?i)\bmy\s+(?:job|boss|company|coworker|career|workplace|school|college|university|exam|exams|grade|grades|degree)\b'
    - '(?i)\b(?:i\s+just\s+got\s+hired|i\s+just\s+got\s+promoted|i\s+just\s+got\s+fired|i\s+work\s+at)\b'
    - '(?i)\bmy\s+(?:friend|friends|partner|relationship|ex|breakup)\b'
    - '(?i)\b(?:i''?m\s+planning\s+to|i\s+am\s+planning\s+to|my\s+plan\s+is|i\s+plan\s+to|i''?m\s+about\s+to)\b'
    - '(?i)\b(?:i\s+just\s+got|i\s+just\s+bought|i\s+just\s+started|i\s+just\s+lost|i\s+just\s+moved)\b'
    - '(?i)\bmy\s+(?:project|favorite|favourite|preferred|name|laptop|pc|computer|gpu|specs|cpu|editor|os|setup|hobby|preference|stack|hardware|card|pin|password)\b'
    - '(?i)\bi\s+(?:use|used|using|prefer|preferred|like|liked|love|loved|hate|dislike|have|had|work|worked|live|lived|own|owned|code|program|run|develop)\b'
    - '(?i)\b(?:i\s+am|i''?m|im|i\s+was)\b'
    - '(?i)\b(?:i''?ve|ive)\s+(?:been|got|had|used|built|created|configured)\b'
    - '(?i)\bremember\s+(?:that\s+)?(?:i|my)\b'
    - '(?i)\bnote\s+(?:that\s+)?(?:i|my)\b'
  task_request_patterns:
    - '(?i)^(?:i\s+want\s+to|i\s+need\s+to|i\s+would\s+like\s+to|can\s+you\s+help\s+me\s+to)\s+(?:learn|build|write|create|debug|understand|solve|implement|code|explain|make|test)\b'
    - '(?i)\b(?:can\s+you\s+help|help\s+me\s+with|how\s+do\s+i|how\s+can\s+i)\b'

local:
  provider: ollama
  host: http://localhost:11434
  default_model: gemma3:4b      # 3B-4B at Q4 fits 6 GB VRAM
  keep_alive: "30m"             # keep model in VRAM
  allowed_models:               # larger ones run slower (partial CPU offload)
    - gemma3:4b
    - llama3.2:3b
    - qwen3.5:4b
    - qwen2.5:3b
    - qwen2.5-coder:3b
    - qwen2.5:7b
  max_context_tokens: 2000
  think: false
  options:
    temperature: 0.6
    top_p: 0.9
    repeat_penalty: 1.1
    presence_penalty: 0.0
    num_predict: 300
    num_ctx: 2048

api:
  provider: openai_compatible   # "openai_compatible" (or "openrouter", "openai") | "anthropic"
  base_url: https://openrouter.ai/api/v1
  model: nvidia/nemotron-3-ultra-550b-a55b:free
  api_key_env: HINAKU_API_KEY   # key is read from the environment / .env, never stored here
  max_tokens: 1024
  timeout_seconds: 90
  send_personal_context: false   # never attach memories or personal data to API requests
  logged_by_provider: true       # free endpoint is logged; show this in the UI
  max_requests_per_day: 100

memory:
  enabled: true
  store: sqlite+chroma
  sqlite_path: data/hinaku.db
  chroma_path: data/chroma
  extract_after_each_turn: true
  learn_from_private_chats: false
  retrieve_top_k: 3
  min_similarity: 0.46
  embedding_model: qwen3-embedding:0.6b
  embedding_dims: 1024
  embedding_keep_alive: "5m"
  embedding_num_ctx: 512
  query_prefix: "Instruct: Given the owner's message, retrieve stored facts about the owner that help answer it\nQuery: "
  document_prefix: ""
  merge_similar: true
  merge_threshold: 0.80
  never_store:                  # extraction must drop these
    - passwords
    - api_keys
    - government_id_numbers
    - bank_or_card_numbers

training:
  interval_months: 6
  allow_manual_run: true
  base_model: Qwen/Qwen2.5-1.5B-Instruct   # 1B-1.5B fits QLoRA on 6 GB VRAM
  method: qlora
  load_in_4bit: true
  max_seq_len: 1024
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  per_device_batch_size: 1
  grad_accum_steps: 16
  gradient_checkpointing: true
  epochs: 2
  min_vram_gb: 5.5              # preflight: refuse to start below this
  pause_when_user_active: true
  datasets_dir: data/datasets
  models_dir: models
  keep_versions: 3              # previous promoted models kept for rollback
  export_gguf: true
  ollama_name_template: "hinaku-{yyyy}-{mm}"

curation:
  min_examples_to_train: 200
  api_answers_require_thumbs_up: true
  exclude_api_answers: false
  include: [thumbs_up, owner_edited, accepted_api_answers]
  exclude: [thumbs_down, marked_private, deleted]
  owner_review_required: true   # owner can remove items before training

evaluation:
  golden_file: eval/golden.jsonl
  compare_against: [current_local, api]
  promote_only_if_better: true
  min_improvement: 0.02         # new model must beat current by this margin
  auto_promote_without_eval: false   # must never be true

guards:
  sensitive_data:
    enabled: true
    reply: "I won't store PINs, passwords, or card numbers. A password manager is the right place for them."
  live_data:
    enabled: true
    reply: "I don't have access to live data like real-time prices, current weather, or today's news. A search engine or dedicated tracker is the right place for that."
    patterns:
      - '(?i)\b(?:current|latest|today''?s?|yesterday''?s?|live)\b.*\b(?:stock|share|crypto|bitcoin|btc|eth|market|price|quote|close|closing)\b'
      - '(?i)\b(?:what\s+is|what''s|how\s+much\s+is)\b.*\b(?:stock|share|crypto|bitcoin|btc|eth|market)\s+(?:price|value|worth)\b'
      - '(?i)\b(?:what\s+was)\b.*\b(?:closing\s+price|market\s+close)\b'
      - '(?i)\b(?:nvidia''?s?|apple''?s?|tesla''?s?|google''?s?|microsoft''?s?)\s+(?:closing\s+price|stock\s+price|current\s+price)\b'
      - '(?i)\b(?:what\s+is\s+the\s+weather|current\s+weather|weather\s+today|weather\s+forecast|is\s+it\s+raining\s+outside|temperature\s+outside)\b'
      - '(?i)\b(?:today''?s?|current|breaking|latest)\s+(?:news|headlines)\b'
      - '(?i)\b(?:score\s+of|who\s+won)\b.*\b(?:game|match|today|yesterday|super\s*bowl|world\s*cup|nba|ipl)\b'
      - '(?i)\b(?:what\s+(?:time|day|date)\s+is\s+it|what\s+is\s+today''?s?\s+date|current\s+time)\b'
      - '(?i)\blatest\b\s+(?:news|headlines|score|stock\s+price)\b'

paths:
  logs: logs
  data: data

bakeoff:
  models:
    - gemma3:4b
    - llama3.2:3b
