<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HINAKU</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Ambient cosmos canvas for subtle drifting particles -->
  <canvas id="starfield" class="starfield"></canvas>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn" title="Start new conversation">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Chat</span>
        </button>
        <button id="sidebar-close-btn" class="icon-btn mobile-only" title="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-section-title">Conversations</div>
      <div class="conversations-scroll">
        <div id="conversations-list" class="conversations-list">
          <!-- Dynamically populated -->
        </div>
      </div>
    </aside>

    <!-- Overlay for mobile/narrow screens -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Container -->
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button id="sidebar-toggle-btn" class="icon-btn sidebar-toggle" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand">
            <div class="void-mark"></div>
            <div class="brand-text">
              <span class="title">HINAKU</span>
              <span class="subtitle">ヒナク &bull; An infinite void</span>
            </div>
          </div>
        </div>
        <div class="header-status">
          <span class="status-indicator" id="status-indicator"></span>
          <span class="model-badge" id="model-badge">qwen3.5:4b &bull; local</span>
        </div>
      </header>

      <div id="notice-banner" class="notice-banner hidden">
        <span class="notice-icon">⚠️</span>
        <span class="notice-text" id="notice-text">Persona file missing or empty. Using neutral fallback prompt.</span>
      </div>

      <!-- Main Chat Area -->
      <main class="chat-container">
        <div class="messages" id="messages-container">
          <div class="message assistant intro-message">
            <div class="message-meta">
              <span class="sender-name">HINAKU</span>
            </div>
            <div class="message-body">
              I am HINAKU. I am listening.
            </div>
          </div>
        </div>
      </main>

      <!-- Input Footer -->
      <footer class="app-footer">
        <div class="input-wrapper">
          <textarea
            id="prompt-input"
            placeholder="Speak with intent... (Shift+Enter for newline)"
            rows="1"
            autofocus
          ></textarea>
          <button id="send-button" class="action-btn send-btn" title="Send message (Enter)">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="footer-meta">
          <span class="hint">HP V15 &bull; RTX 4050 &bull; Local inference</span>
        </div>
      </footer>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
